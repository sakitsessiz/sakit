name: Daily Car Alerts Email

on:
  schedule:
    # Azərbaycan (Bakı) saatı il ilə UTC+4 sabitdir (yay vaxtına keçid yoxdur).
    # 10:00 Bakı vaxtı = 06:00 UTC
    - cron: '0 6 * * *'
    # 14:00 Bakı vaxtı = 10:00 UTC
    - cron: '0 10 * * *'
    # 17:00 Bakı vaxtı = 13:00 UTC
    - cron: '0 13 * * *'
  # Manuel test etmək üçün: repo -> Actions -> "Daily Car Alerts Email" -> "Run workflow"
  workflow_dispatch: {}

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Repo-nu çək
        uses: actions/checkout@v4

      - name: Node.js quraşdır
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bildiriş skriptini işə sal
        env:
          JSONBIN_BIN_ID: ${{ secrets.JSONBIN_BIN_ID }}
          JSONBIN_MASTER_KEY: ${{ secrets.JSONBIN_MASTER_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          # CallMeBot (WhatsApp) - opsional. Boş qalsa, skript yalnız mail göndərər.
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node scripts/send-alerts.js
